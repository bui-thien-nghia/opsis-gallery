[package]
name = "det_test"
version = "0.1.0"
edition = "2024"

[dependencies]
# Engines & essential data types
ort = "2.0.0-rc.15"
oar-ocr = "0.11.0"
oar-ocr-core = "0.11.0"
ndarray = "0.17"
image = "0.25"

# Database & Fuzzy search
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
nucleo-matcher = "0.3"

# Misc
indicatif = "0.17"
anyhow = "1.0"
sysinfo = "0.40"