[package]
edition = "2024"
rust-version = "1.92"
name = "ultralytics-inference"
version = "0.0.61"
authors = [
    "Glenn Jocher <glenn.jocher@ultralytics.com>",
    "Onuralp Sezer <onuralp@ultralytics.com>",
]
build = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/examples/**/*.rs",
    "/examples/README.md",
    "/docs/**/*.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Ultralytics YOLO inference library and CLI for Rust"
homepage = "https://www.ultralytics.com"
documentation = "https://docs.rs/ultralytics-inference"
readme = "README.md"
keywords = [
    "yolo",
    "ultralytics",
    "inference",
    "computer-vision",
    "ml",
]
categories = [
    "computer-vision",
    "science",
    "command-line-interface",
]
license = "AGPL-3.0"
repository = "https://github.com/ultralytics/inference"

[package.metadata.docs.rs]
features = [
    "annotate",
    "visualize",
    "video",
    "track",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]
targets = ["x86_64-unknown-linux-gnu"]

[features]
acl = ["ort/acl"]
all = [
    "annotate",
    "visualize",
    "video",
    "track",
]
amd = [
    "rocm",
    "migraphx",
]
annotate = [
    "imageproc",
    "ab_glyph",
    "harfrust",
    "unicode-bidi",
]
azure = ["ort/azure"]
cann = ["ort/cann"]
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
cuda-preprocess = [
    "cuda",
    "tensorrt",
    "dep:cudarc",
]
default = [
    "annotate",
    "visualize",
]
directml = ["ort/directml"]
intel = [
    "openvino",
    "onednn",
]
migraphx = ["ort/migraphx"]
mobile = [
    "nnapi",
    "coreml",
    "qnn",
]
nnapi = ["ort/nnapi"]
nvidia = [
    "cuda",
    "tensorrt",
]
onednn = ["ort/onednn"]
openvino = ["ort/openvino"]
openvino-native = ["dep:openvino"]
qnn = ["ort/qnn"]
rknpu = ["ort/rknpu"]
rocm = ["ort/rocm"]
tensorrt = [
    "cuda",
    "ort/tensorrt",
]
track = []
tvm = ["ort/tvm"]
video = ["dep:ffmpeg-next"]
visualize = [
    "minifb",
    "annotate",
]
webgpu = ["ort/webgpu"]
xnnpack = ["ort/xnnpack"]

[lib]
name = "ultralytics_inference"
path = "src/lib.rs"

[[bin]]
name = "ultralytics-inference"
path = "src/main.rs"

[[example]]
name = "annotate"
path = "examples/annotate.rs"
required-features = ["annotate"]

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "config"
path = "examples/config.rs"

[[example]]
name = "tasks"
path = "examples/tasks.rs"

[[example]]
name = "track"
path = "examples/track.rs"
