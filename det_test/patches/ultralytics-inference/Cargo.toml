[lints.clippy]
all = "warn"
cargo = "warn"
nursery = "warn"
pedantic = "warn"

[lints.rust]
missing_docs = "warn"
unsafe_code = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(coverage_nightly)"]

[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.test.package."*"]
opt-level = 0
